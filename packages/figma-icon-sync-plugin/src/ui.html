<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --ok: #14ae5c;
        --warn: #f5a623;
        --err: #e5484d;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 12px;
        line-height: 1.4;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      .content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .footer {
        border-top: 1px solid var(--figma-color-border);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .summary {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 4px;
      }
      .summary .count {
        font-size: 34px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .summary .label {
        font-size: 13px;
        color: var(--figma-color-text-secondary);
      }
      .meta {
        color: var(--figma-color-text-secondary);
        margin-bottom: 4px;
      }
      .meta b {
        color: var(--figma-color-text);
        font-weight: 600;
      }
      .page-warn {
        color: var(--warn);
        margin: 6px 0 0;
      }

      .section-title {
        text-transform: uppercase;
        letter-spacing: 0.06em;
        font-size: 10px;
        font-weight: 600;
        color: var(--figma-color-text-secondary);
        margin: 20px 0 8px;
      }

      .check-group {
        margin-bottom: 6px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
      }
      .check-group.has-issues .check {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }
      .badge {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .badge.ok {
        background: var(--ok);
      }
      .badge.warn {
        background: var(--warn);
      }
      .badge.err {
        background: var(--err);
      }
      .badge.pending {
        background: var(--figma-color-bg-disabled, #8c8c8c);
        color: var(--figma-color-text-secondary);
      }
      .check .text {
        flex: 1;
      }

      .issues {
        border: 1px solid var(--figma-color-border);
        border-top: none;
        border-bottom-left-radius: 6px;
        border-bottom-right-radius: 6px;
        overflow: hidden;
      }
      .issue {
        display: flex;
        gap: 8px;
        padding: 7px 10px 7px 34px;
        background: var(--figma-color-bg-secondary);
        border-top: 1px solid var(--figma-color-border);
      }
      .issue.clickable {
        cursor: pointer;
      }
      .issue.clickable:hover {
        background: var(--figma-color-bg-hover, var(--figma-color-bg-secondary));
      }
      .issue .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin-top: 5px;
        flex: 0 0 auto;
      }
      .issue.error .dot {
        background: var(--err);
      }
      .issue.warning .dot {
        background: var(--warn);
      }
      .issue .body {
        flex: 1;
        min-width: 0;
      }
      .issue .msg {
        color: var(--figma-color-text);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 6px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        color: var(--figma-color-text);
        cursor: pointer;
        font-size: 11px;
        line-height: 1.2;
      }
      .pill:hover {
        border-color: var(--figma-color-border-brand, var(--ok));
        color: var(--figma-color-text-brand, var(--figma-color-text));
      }

      .empty {
        color: var(--figma-color-text-secondary);
        padding: 10px 0;
      }

      .diff-summary {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .stat {
        flex: 1;
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
        padding: 8px 10px;
      }
      .stat .num {
        font-size: 18px;
        font-weight: 650;
      }
      .stat .num.add {
        color: var(--ok);
      }
      .stat .num.remove {
        color: var(--err);
      }
      .stat .cap {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }
      .diff-list {
        margin-bottom: 8px;
      }
      .diff-list .head {
        font-size: 11px;
        font-weight: 600;
        margin: 6px 0 4px;
      }
      .diff-list .head.add {
        color: var(--ok);
      }
      .diff-list .head.remove {
        color: var(--err);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 1.2;
        border: 1px solid var(--figma-color-border);
        background: var(--figma-color-bg-secondary);
      }
      .chip.add {
        cursor: pointer;
      }
      .chip.add:hover {
        border-color: var(--ok);
      }
      .chip.remove {
        color: var(--figma-color-text-secondary);
        text-decoration: line-through;
      }
      .diff-note {
        color: var(--figma-color-text-secondary);
        font-size: 11px;
      }
      .ver {
        color: var(--figma-color-text-secondary);
        font-weight: 400;
        text-transform: none;
        letter-spacing: 0;
      }

      button {
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        border: 1px solid transparent;
        padding: 9px 12px;
        cursor: pointer;
      }
      button.secondary {
        background: var(--figma-color-bg-secondary);
        color: var(--figma-color-text);
        border-color: var(--figma-color-border);
      }
      button.primary {
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
      }
      button.primary:disabled {
        background: var(--figma-color-bg-disabled);
        color: var(--figma-color-text-disabled);
        cursor: not-allowed;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .actions button {
        flex: 1;
      }
      .status {
        min-height: 16px;
        font-size: 11px;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.err {
        color: var(--err);
      }
      .status.pending {
        color: var(--figma-color-text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="summary">
        <span class="count" id="count">…</span>
        <span class="label">icons detected</span>
      </div>
      <div class="meta" id="meta"></div>
      <div class="page-warn" id="page-warn" style="display: none"></div>

      <div class="section-title">Verification</div>
      <div id="checks"></div>

      <div class="section-title" id="diff-title">Changes since last release</div>
      <div id="diff"></div>
    </div>

    <div class="footer">
      <div class="status" id="status"></div>
      <div class="actions">
        <button class="secondary" id="rescan">Rescan</button>
        <button class="primary" id="open-sync" disabled>Open sync on GitHub</button>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);

      let currentResult = null;
      let qualityPending = false;

      const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*');

      // Each verification group owns a set of issue rules; details render beneath it.
      const GROUPS = [
        {
          rules: ['duplicate-name'],
          ok: 'No duplicate names',
          fail: (n) => n + ' duplicate icon name(s)',
        },
        {
          rules: ['number-in-name', 'empty-name', 'modifier-order'],
          ok: 'Names valid',
          fail: (n) => n + ' naming issue(s)',
        },
        {
          rules: [
            'invalid-size-label',
            'disallowed-size',
            'no-variants',
            'duplicate-size',
            'incomplete-sizes',
            'size-mismatch',
          ],
          ok: 'Icon sizes valid (' + [12, 16, 20, 24, 32].join('/') + ')',
          fail: (n, hasErr) => n + (hasErr ? ' size error(s)' : ' size warning(s)'),
        },
        {
          rules: ['fill-and-stroke'],
          ok: 'No fill + stroke overlaps',
          fail: (n) => n + ' icon(s) draw fill + stroke',
        },
        {
          rules: ['hidden-layers', 'not-single-shape'],
          ok: 'Clean single shape',
          fail: (n) => n + ' structure issue(s)',
        },
        {
          rules: ['orphan'],
          ok: null, // nothing to show when clean
          fail: (n) => 'Component sets outside an “Icons” frame',
        },
      ];

      function issueHtml(i) {
        const hasTargets = i.targets && i.targets.length;
        const pills = hasTargets
          ? '<div class="pills">' +
            i.targets
              .map(
                (t) =>
                  '<span class="pill" data-id="' +
                  t.nodeId +
                  '">' +
                  escapeHtml(t.label) +
                  '</span>',
              )
              .join('') +
            '</div>'
          : '';
        const clickable = !hasTargets && i.nodeId ? ' clickable' : '';
        const dataId = !hasTargets && i.nodeId ? ' data-id="' + i.nodeId + '"' : '';
        return (
          '<div class="issue ' +
          i.severity +
          clickable +
          '"' +
          dataId +
          '><span class="dot"></span><div class="body"><div class="msg">' +
          i.msg_escaped +
          '</div>' +
          pills +
          '</div></div>'
        );
      }

      function groupHtml(state, headline, issues) {
        const symbol =
          state === 'ok' ? '✓' : state === 'warn' ? '!' : state === 'pending' ? '⋯' : '✕';
        const hasIssues = issues.length > 0;
        const issuesHtml = hasIssues
          ? '<div class="issues">' + issues.map(issueHtml).join('') + '</div>'
          : '';
        return (
          '<div class="check-group' +
          (hasIssues ? ' has-issues' : '') +
          '"><div class="check"><span class="badge ' +
          state +
          '">' +
          symbol +
          '</span><span class="text">' +
          headline +
          '</span></div>' +
          issuesHtml +
          '</div>'
        );
      }

      function renderChecks(r) {
        let html = '';
        for (const group of GROUPS) {
          const isQuality = group.rules.includes('fill-and-stroke');
          if (isQuality && qualityPending) {
            html += groupHtml('pending', 'Checking for fill + stroke overlaps…', []);
            continue;
          }

          const issues = r.issues.filter((i) => group.rules.includes(i.rule));
          const errs = issues.filter((i) => i.severity === 'error');
          if (!issues.length && group.ok === null) continue; // hide clean optional groups

          let state;
          let headline;
          if (!issues.length) {
            state = 'ok';
            headline = group.ok;
          } else {
            state = errs.length ? 'err' : 'warn';
            headline = group.fail(issues.length, errs.length > 0);
          }
          html += groupHtml(state, headline, issues);
        }
        $('checks').innerHTML = html;

        Array.from(document.querySelectorAll('#checks [data-id]')).forEach((el) => {
          el.addEventListener('click', (event) => {
            event.stopPropagation();
            const id = el.getAttribute('data-id');
            if (id) post({ type: 'focus', id });
          });
        });
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function prepIssues(list) {
        return list.map((i) => ({ ...i, msg_escaped: escapeHtml(i.message) }));
      }

      function updateStatus(r) {
        if (r.errorCount > 0) {
          setStatus(r.errorCount + ' error(s) to fix before syncing', 'err');
        } else if (r.warningCount > 0) {
          setStatus('Passed with ' + r.warningCount + ' warning(s) — ready to sync', 'ok');
        } else {
          setStatus('All checks passed — ready to sync', 'ok');
        }
        $('open-sync').disabled = !r.passed;
      }

      function renderResult(r) {
        r.issues = prepIssues(r.issues);
        currentResult = r;

        $('count').textContent = r.iconCount;
        const parts = [];
        parts.push('<b>' + r.variantCount + '</b> size variants');
        parts.push('<b>' + r.categoryCount + '</b> categories');
        $('meta').innerHTML =
          parts.join(' · ') + ' · on page <b>' + escapeHtml(r.pageName) + '</b>';

        if (r.usedFallbackPage) {
          $('page-warn').style.display = 'block';
          $('page-warn').textContent =
            'No page named “Icons” found — scanned the current page instead.';
        } else {
          $('page-warn').style.display = 'none';
        }

        renderChecks(r);
        updateStatus(r);
      }

      function renderDiffLoading() {
        $('diff-title').innerHTML = 'Changes since last release';
        $('diff').innerHTML = '<div class="diff-note">Comparing with the latest npm release…</div>';
      }

      function chip(cls, label, id) {
        return (
          '<span class="chip ' +
          cls +
          '"' +
          (id ? ' data-id="' + id + '"' : '') +
          '>' +
          escapeHtml(label) +
          '</span>'
        );
      }

      function renderDiff(d) {
        const verLabel = d.comparedToVersion ? ' <span class="ver">v' + escapeHtml(d.comparedToVersion) + '</span>' : '';
        $('diff-title').innerHTML = 'Changes since last release' + verLabel;

        if (d.error) {
          $('diff').innerHTML = '<div class="diff-note">' + escapeHtml(d.error) + '</div>';
          return;
        }
        if (!d.added.length && !d.removed.length) {
          $('diff').innerHTML =
            '<div class="diff-note">No icons added or removed since the last release.</div>';
          return;
        }

        let html = '';
        html +=
          '<div class="diff-summary">' +
          '<div class="stat"><div class="num add">+' +
          d.added.length +
          '</div><div class="cap">added</div></div>' +
          '<div class="stat"><div class="num remove">−' +
          d.removed.length +
          '</div><div class="cap">removed</div></div>' +
          '</div>';

        if (d.added.length) {
          html +=
            '<div class="diff-list"><div class="head add">Added</div><div class="chips">' +
            d.added.map((a) => chip('add', a.name, a.nodeId)).join('') +
            '</div></div>';
        }
        if (d.removed.length) {
          html +=
            '<div class="diff-list"><div class="head remove">Removed</div><div class="chips">' +
            d.removed.map((r) => chip('remove', r.name)).join('') +
            '</div></div>';
        }
        $('diff').innerHTML = html;

        Array.from(document.querySelectorAll('#diff .chip.add[data-id]')).forEach((el) => {
          el.addEventListener('click', () => {
            const id = el.getAttribute('data-id');
            if (id) post({ type: 'focus', id });
          });
        });
      }

      function setStatus(text, kind) {
        const el = $('status');
        el.textContent = text || '';
        el.className = 'status' + (kind ? ' ' + kind : '');
      }

      $('rescan').addEventListener('click', () => {
        setStatus('Scanning…', 'pending');
        post({ type: 'rescan' });
      });

      $('open-sync').addEventListener('click', () => {
        if ($('open-sync').disabled) return;
        post({ type: 'open-sync' });
      });

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === 'scan-result') {
          qualityPending = false;
          renderResult(msg.result);
        } else if (msg.type === 'quality-loading') {
          qualityPending = true;
          if (currentResult) renderChecks(currentResult);
        } else if (msg.type === 'quality-result') {
          qualityPending = false;
          if (currentResult) {
            currentResult.issues = currentResult.issues
              .filter((i) => i.rule !== 'fill-and-stroke')
              .concat(prepIssues(msg.issues));
            currentResult.warningCount = currentResult.issues.filter(
              (i) => i.severity === 'warning',
            ).length;
            renderChecks(currentResult);
            updateStatus(currentResult);
          }
        } else if (msg.type === 'diff-loading') {
          renderDiffLoading();
        } else if (msg.type === 'diff-result') {
          renderDiff(msg.diff);
        }
      };
    </script>
  </body>
</html>
